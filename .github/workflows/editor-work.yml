name: Verify canvas editing update
on:
  push:
    branches: [work/canvas-edit-20261009]
permissions:
  contents: read
concurrency:
  group: smart-home-editor-verification
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.apply.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Apply the verified source patch to its exact baseline
        id: apply
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$BRANCH" = 'work/canvas-edit-20261009'
          git diff --quiet 5ee0722547cc26b33ac6e0a0301d46e99dd40214 HEAD -- . ':!.github/workflows/editor-work.yml'
          patch_file="$RUNNER_TEMP/smart-home-update.patch.xz"
          : > "$patch_file"
          for sha in d353ef68de7369dd2c6f43bd2f4776e08ff0335d 8ae967fe1e9bb436fc5a4ec4a91d2d746dbe882b 351f07b9cc07125759838a4e179b7f91031893f3 eaa4c26815434261e51fd513494627ed7462793f; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$sha" --jq .content | base64 --decode >> "$patch_file"
          done
          echo "737f2a53d6ca96b6358d3c190d48d70f03640751b9b484e1299aa036c31da958  $patch_file" | sha256sum --check
          xz --decompress --stdout "$patch_file" > "$RUNNER_TEMP/smart-home-update.patch"
          git apply --check --index --unidiff-zero "$RUNNER_TEMP/smart-home-update.patch"
          git apply --index --unidiff-zero "$RUNNER_TEMP/smart-home-update.patch"
          git rm .github/workflows/editor-work.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: unify canvas editing and persist named projects in IndexedDB'
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/smart-home-source.tgz"
          git rev-parse HEAD > "$RUNNER_TEMP/source-revision.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: smart-home-updated-source
          path: |
            ${{ runner.temp }}/smart-home-source.tgz
            ${{ runner.temp }}/source-revision.txt
          retention-days: 3
  verify:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NX_DAEMON: 'false'
      NX_ISOLATE_PLUGINS: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e -- --max-failures=6
      - run: npm run build
      - name: Verify optimized application and native IndexedDB under Pages base path
        run: node e2e/production.mjs
      - name: Audit runtime dependencies
        if: always()
        run: npm audit --omit=dev --audit-level=high --json > dependency-audit.json
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: smart-home-canvas-verification
          path: |
            playwright-report/
            test-results/
            dependency-audit.json
          retention-days: 7
