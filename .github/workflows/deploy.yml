name: Build and deploy Smart Home
on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'AGENTS.md']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: smart-home-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NX_DAEMON: 'false'
      NX_ISOLATE_PLUGINS: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - run: npm run build
      - name: Verify optimized application under the Pages base path
        run: node e2e/production.mjs
      - name: Audit runtime dependencies
        if: always()
        run: npm audit --omit=dev --audit-level=high --json > dependency-audit.json
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smart-home-verification
          path: |
            playwright-report/
            test-results/
            dependency-audit.json
          retention-days: 7
      - name: Record deployed revision
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          node --input-type=module -e "import fs from 'node:fs';fs.writeFileSync('dist/smart-home/browser/build-info.json',JSON.stringify({application:'Smart Home',commit:process.env.COMMIT_SHA,builtAt:new Date().toISOString()}));"
      - name: Upload static application
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist/smart-home/browser
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify Pages configuration
        uses: actions/configure-pages@v5
      - name: Deploy Smart Home
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public site and deployed revision
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 5 "${PAGE_URL}?run=${GITHUB_RUN_ID}" > page.html
          grep -q '<sh-root' page.html
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error "${PAGE_URL}build-info.json?run=${GITHUB_RUN_ID}-${attempt}" > build-info.json && python3 -c 'import json,os; assert json.load(open("build-info.json"))["commit"] == os.environ["COMMIT_SHA"]'; then
              echo "Published and verified: ${PAGE_URL}" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo 'The public artifact revision did not match this workflow.' >&2
          exit 1
